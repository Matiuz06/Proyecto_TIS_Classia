<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restablecer Contraseña — Classia</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-brand" href="../index.html">
          <img src="../assets/logoC.png" />
        </a>
        <nav class="site-nav" aria-label="Navegación principal">
          <a href="../index.html">Inicio</a>
          <a href="catalogo.html">Catálogo</a>
          <a href="carrito.html">Carrito</a>
          <a href="usuario.html" aria-current="page">Mi cuenta</a>
        </nav>
      </div>
    </header>
    <!-- TARJETA CENTRADA -->
    <div class="card-container">
      <span class="brand-mark">Classia</span>
      <h1>Restablecer Contraseña</h1>
      <p>Ingresa tu correo para enviarte las instrucciones de recuperación.</p>

      <form action="/restablecer_contra" method="POST">
        <p>
          <label for="correo1"><strong>Correo registrado:*</strong></label
          ><br />
          <input
            type="email"
            id="correo1"
            name="correo_recuperacion"
            placeholder="ejemplo@correo.com"
            required />
        </p>

        <p>
          <label for="cont2"><strong>Nueva contraseña:*</strong></label
          ><br />
          <input
            type="password"
            id="cont2"
            name="nueva_contrasena"
            placeholder="Nueva contraseña"
            required />
        </p>

        <button type="submit">Enviar Restablecimiento</button>
      </form>

      <hr />

      <p>
        <a href="login.html">← Iniciar Sesión</a>
      </p>
      <p>
        <a href="registro.html">¿No tienes cuenta? Regístrate</a>
      </p>
    </div>
  </body>
</html>
