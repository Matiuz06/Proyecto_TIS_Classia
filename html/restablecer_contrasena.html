<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Restablecer Contraseña — Classia</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- TARJETA CENTRADA -->
  <div class="card-container">

    <img src="../assets/Isotipo +Logo AniTech Letras.png" alt="Logo AniTech" width="140" style="margin-bottom: 10px;">
    <h3 style="margin-bottom: 6px;">Restablecer Contraseña</h3>
    <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Ingresa tu correo para enviarte las instrucciones de recuperación.</p>

    <form action="/restablecer_contra" method="POST">
      
      <p>
        <label for="correo1"><strong>Correo registrado:*</strong></label><br>
        <input type="email" id="correo1" name="correo_recuperacion" placeholder="ejemplo@correo.com" required>
      </p>

      <p>
        <label for="cont2"><strong>Nueva contraseña:*</strong></label><br>
        <input type="password" id="cont2" name="nueva_contrasena" placeholder="Nueva contraseña" required>
      </p>

      <button type="submit" style="width: 100%; margin-top: 10px;">
        Enviar Restablecimiento
      </button>

    </form>

    <hr style="margin: 20px 0 15px 0;">

    <p style="font-size: 14px; margin-bottom: 6px;">
      <a href="login.html">← Iniciar Sesión</a>
    </p>
    <p style="font-size: 14px; margin: 0;">
      <a href="registro.html">¿No tienes cuenta? Regístrate</a>
    </p>

  </div>

</body>
</html>
