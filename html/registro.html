<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Registro de usuario en Classia." />
    <title>Crear cuenta | Classia</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="auth-page">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-brand" href="../index.html">
          <img src="../assets/logoC.png" />
        </a>
        <nav class="site-nav" aria-label="Navegación principal">
          <a href="../index.html">Inicio</a>
          <a href="catalogo.html">Catálogo</a>
          <a href="carrito.html">Carrito</a>
          <a href="usuario.html" aria-current="page">Mi cuenta</a>
        </nav>
      </div>
    </header>
    <main class="auth-shell">
      <section class="auth-intro" aria-labelledby="intro-registro">
        <h1 id="intro-registro">Creá tu cuenta en Classia</h1>
        <p>
          Unificá aprendizaje, servicios educativos y gestión académica en una
          plataforma clara.
        </p>
      </section>

      <section class="auth-card" aria-labelledby="titulo-registro">
        <h2 id="titulo-registro">Registro</h2>
        <p class="muted">Completá tus datos básicos para empezar.</p>
        <form action="/registro" method="POST">
          <p>
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              autocomplete="given-name"
              required
              placeholder="Ingresa tu nombre" />
          </p>
          <p>
            <label for="apellido">Apellido</label>
            <input
              type="text"
              id="apellido"
              name="apellido"
              autocomplete="family-name"
              required
              placeholder="Ingresa tu apellido" />
          </p>
          <p>
            <label for="usuario">Nombre de usuario</label>
            <input
              type="text"
              id="usuario"
              name="usuario"
              autocomplete="username"
              required
              placeholder="Ingresa un usuario" />
          </p>
          <p>
            <label for="correo">Correo electrónico</label>
            <input
              type="email"
              id="correo"
              name="correo"
              autocomplete="email"
              required
              placeholder="ejemplo@correo.com" />
          </p>
          <p>
            <label for="contrasena">Contraseña</label>
            <input
              type="password"
              id="contrasena"
              name="contraseña"
              autocomplete="new-password"
              required
              placeholder="Ingresa una contraseña" />
          </p>
          <p>
            <label for="confirmar-contrasena">Confirmar contraseña</label>
            <input
              type="password"
              id="confirmar-contrasena"
              name="confirmar_contraseña"
              autocomplete="new-password"
              required
              placeholder="Confirma tu contraseña" />
          </p>
          <fieldset>
            <legend>Género</legend>
            <label
              ><input type="radio" name="genero" value="hombre" /> Hombre</label
            >
            <label
              ><input type="radio" name="genero" value="mujer" /> Mujer</label
            >
            <label
              ><input type="radio" name="genero" value="sin-especificar" />
              Prefiero no decirlo</label
            >
          </fieldset>
          <button type="submit">Registrarse</button>
        </form>
        <p class="auth-links">
          ¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a>
        </p>
      </section>
    </main>
  </body>
</html>
