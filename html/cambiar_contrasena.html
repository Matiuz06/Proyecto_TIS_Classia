<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambiar contraseña</title>
    <link rel="stylesheet" href="../css/animation.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/png" href="../assets/favicon.png" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-brand" href="../index.html">
          <img src="../assets/logoC.png" />
        </a>
        <nav class="site-nav" aria-label="Navegación principal">
          <a href="../index.html">Inicio</a>
          <a href="catalogo.html">Catálogo</a>
          <a href="carrito.html">Carrito</a>
          <a href="login.html" aria-current="page" class="cuenta">Mi cuenta</a>
        </nav>
      </div>
    </header>
    <!-- TARJETA CENTRADA -->
    <div class="card-container">
      <span class="brand-mark">Classia</span>
      <h1>Cambiar Contraseña</h1>

      <form action="/cambiar_contra" method="POST">
        <p>
          <label for="cont1"><strong>Contraseña actual:*</strong></label
          ><br />
          <input type="password" id="cont1" name="contrasena_actual" required />
        </p>

        <p>
          <label for="cont2"><strong>Nueva contraseña:*</strong></label
          ><br />
          <input type="password" id="cont2" name="contrasena_nueva" required />
        </p>

        <p>
          <label for="cont3"
            ><strong>Confirmar nueva contraseña:*</strong></label
          ><br />
          <input
            type="password"
            id="cont3"
            name="contrasena_confirmar"
            required />
        </p>

        <button type="submit">Guardar Contraseña</button>
      </form>

      <hr />

      <p>
        <a href="restablecer_contrasena.html" class="link"
          >¿Olvidaste tu contraseña?</a
        >
      </p>
      <p>
        <a href="usuario.html" class="link">← Volver al Perfil</a>
      </p>
    </div>
  </body>
</html>
