<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <title>Iniciar Sesión — Classia</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="font-family: sans-serif; background: #f0f0f0; padding: 40px; margin: 0;">

  <div style="background: white; padding: 25px; width: 320px; margin: 0 auto; border-radius: 8px; border: 1px solid #ccc; text-align: center;">
    
    <img src="../assets/logoC.png" alt="Logo AniTech" width="140">
    <h3>Iniciar Sesión</h3>

    <form action="/login" method="POST" style="text-align: left;">
      <p>
        <label for="correo">Correo electrónico:</label><br>
        <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com" style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
      </p>

      <p>
        <label for="contraseña">Contraseña:</label><br>
        <input type="password" id="contraseña" name="contraseña" required placeholder="Ingresa tu contraseña" style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
      </p>

      <p style="font-size: 13px;">
        <label>
          <input type="checkbox" name="terminos" required> Acepto los términos y condiciones
        </label>
      </p>

      <button type="submit" style="width: 100%; padding: 10px; background: #555; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
        Iniciar Sesión
      </button>
    </form>

    <hr style="margin: 20px 0;">

    <p style="font-size: 14px;">
      <a href="restablecer_contrasena.html" style="color: #4a3f9f;">¿Olvidaste tu contraseña?</a>
    </p>
    <p style="font-size: 14px; margin: 0;">
      <a href="registro.html">¿No tienes cuenta? Regístrate</a>
    </p>

  </div>

</body>
</html>
