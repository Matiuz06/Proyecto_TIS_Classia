<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inicio de sesión en Classia." />
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/png" href="../assets/favicon.png" />
  </head>
  <body class="auth-page">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-brand" href="../index.html">
          <img src="../assets/logoC.png" />
        </a>
        <nav class="site-nav" aria-label="Navegación principal">
          <a href="../index.html">Inicio</a>
          <a href="catalogo.html">Catálogo</a>
          <a href="carrito.html">Carrito</a>
          <a href="usuario.html" aria-current="page">Mi cuenta</a>
        </nav>
      </div>
    </header>
    <main class="auth-shell">
      <section class="auth-intro" aria-labelledby="intro-login">
        <h1 id="intro-login">Entrá a tu espacio educativo</h1>
        <p>
          Accedé a tus cursos, solicitudes, publicaciones y herramientas de
          gestión desde una cuenta Classia.
        </p>
      </section>

      <section class="auth-card" aria-labelledby="titulo-login">
        <h2 id="titulo-login">Iniciar sesión</h2>
        <p class="muted">Usá tu correo y contraseña para continuar.</p>
        <form action="/login" method="POST">
          <p>
            <label for="correo">Correo electrónico</label>
            <input
              type="email"
              id="correo"
              name="correo"
              autocomplete="email"
              required
              placeholder="ejemplo@correo.com" />
          </p>
          <p>
            <label for="contrasena">Contraseña</label>
            <input
              type="password"
              id="contrasena"
              name="contraseña"
              autocomplete="current-password"
              required
              placeholder="Ingresa tu contraseña" />
          </p>
          <label>
            <input type="checkbox" name="terminos" required /> Acepto los
            términos y condiciones
          </label>
          <button type="submit">Iniciar sesión</button>
        </form>
        <p class="auth-links">
          <a href="restablecer_contrasena.html">¿Olvidaste tu contraseña?</a>
        </p>
        <p class="auth-links">
          ¿No tenés cuenta? <a href="registro.html">Registrate</a>
        </p>
      </section>
    </main>
  </body>
</html>
