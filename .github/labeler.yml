# ── Tipo de archivo ───────────────────────────────────────────
"frontend: html":
  - changed-files:
      - any-glob-to-any-file: "**/*.html"

"frontend: css":
  - changed-files:
      - any-glob-to-any-file: "**/*.css"

"frontend: js":
  - changed-files:
      - any-glob-to-any-file: "**/*.js"

"assets":
  - changed-files:
      - any-glob-to-any-file: ["**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.svg", "**/*.webp"]

"ci/cd":
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

"docs":
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "docs/**"]

# ── Módulos de requerimientos funcionales (RF) ────────────────
# Se infieren por convención de nombres de carpeta/archivo.
# Completar según la estructura real del proyecto.
"RF: autenticación":
  - changed-files:
      - any-glob-to-any-file: ["**/auth*", "**/login*", "**/sesion*", "**/session*", "**/password*"]

"RF: usuarios":
  - changed-files:
      - any-glob-to-any-file: ["**/user*", "**/usuario*", "**/perfil*", "**/profile*", "**/rol*", "**/role*"]

"RF: cursos":
  - changed-files:
      - any-glob-to-any-file: ["**/curso*", "**/course*"]

"RF: contenidos":
