name: Labeler automatico

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  label:
    name: Etiquetar PR segun archivos modificados
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
