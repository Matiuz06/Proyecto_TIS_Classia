name: "🎯 Verificar Milestone / Sprint en PR"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, demilestoned]

jobs:
  check-milestone:
    name: "Verificar asignación de Milestone (Sprint)"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Validar asignación de Milestone
        id: milestone_check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const milestone = pr.milestone;

            if (!milestone) {
              console.log("⚠️ El Pull Request no tiene asignado un Milestone (Sprint).");
              core.setOutput("has_milestone", "false");
            } else {
              console.log(`✅ Milestone asignado: ${milestone.title}`);
              core.setOutput("has_milestone", "true");
            }

      - name: Comentar en el PR si no tiene Milestone
        if: steps.milestone_check.outputs.has_milestone == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 📌 Recordatorio de Sprint / Milestone

            Este Pull Request aún no tiene asignado un **Milestone (Sprint)** en el panel lateral de GitHub.

            > **Recomendación:** Asigná este PR al Milestone correspondiente (ej: *Sprint 1*, *Sprint 2*) para mantener la trazabilidad con el tablero Trello y la planificación.`;

            // Verificar si ya se dejó un comentario similar para evitar duplicados
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const hasBotComment = comments.data.some(comment => 
              comment.body.includes("Recordatorio de Sprint / Milestone")
            );

            if (!hasBotComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
